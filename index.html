<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuel Core: Human OS</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Human OS">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><circle cx='50' cy='50' r='35' stroke='%233b82f6' stroke-width='8' fill='none'/><path d='M35 50 L46 62 L65 38' stroke='%2310b981' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><circle cx='50' cy='50' r='35' stroke='%233b82f6' stroke-width='8' fill='none'/><path d='M35 50 L46 62 L65 38' stroke='%2310b981' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

    <!-- Embedded Web App Manifest Data URL -->
    <link rel="manifest" id="manifestPlaceholder">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentGreen: '#10b981',
                        accentBlue: '#3b82f6',
                        accentGold: '#d97706',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>

    <!-- Stripe.js SDK -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 font-sans select-none pb-12">

    <!-- PWA Install Banner (Displays when install prompt is triggered) -->
    <aside id="installAppBanner" aria-label="Install App" class="w-full max-w-lg mb-4 hidden bg-gradient-to-r from-blue-900/60 to-slate-800 border border-accentBlue/60 rounded-xl p-3 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-accentBlue/20 border border-accentBlue flex items-center justify-center text-accentBlue font-black text-sm">
                OS
            </div>
            <div>
                <p class="text-xs font-bold text-white tracking-wide">Install Nuel Core</p>
                <p class="text-[10px] text-slate-300">Run as a standalone app on your device</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button type="button" onclick="installPWA()" class="bg-accentBlue hover:bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">Install</button>
            <button type="button" onclick="dismissInstallBanner()" class="text-slate-400 hover:text-white text-xs px-2 py-1">✕</button>
        </div>
    </aside>

    <!-- AUTHENTICATION VIEW -->
    <div id="authScreen" class="w-full max-w-md bg-cardBg border border-slate-700 rounded-2xl p-6 shadow-xl mt-8">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-900 border border-slate-700 mb-3 text-accentBlue font-mono font-bold text-lg">
                NU
            </div>
            <h1 class="text-xl font-bold tracking-wider text-slate-100 uppercase">Nuel Core: Human OS</h1>
            <p class="text-xs text-slate-400 mt-1">Rebuild Your Mind. Optimize Your Body. Upgrade Your Life.</p>
        </div>
        
        <!-- Tab Switcher -->
        <div class="flex bg-slate-900 p-1 rounded-lg mb-4 text-xs font-semibold">
            <button type="button" onclick="switchAuthTab('login')" id="loginTabBtn" class="flex-1 py-2 rounded-md bg-accentBlue text-white transition">Sign In</button>
            <button type="button" onclick="switchAuthTab('signup')" id="signupTabBtn" class="flex-1 py-2 rounded-md text-slate-400 transition">Create Account</button>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Email Address</label>
                <input type="email" id="userEmailInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-accentBlue" placeholder="emmanuel@nuelpropertyservices.com">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Password</label>
                <input type="password" id="userPasswordInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-accentBlue" placeholder="••••••••">
            </div>
            <button type="submit" id="authSubmitBtn" class="w-full bg-accentBlue hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm transition">Sign In</button>
            <p id="authErrorMsg" class="text-xs text-red-400 text-center mt-2"></p>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4 flex items-center justify-between">
            <button type="button" onclick="forceResetStorage()" class="text-[11px] text-slate-500 hover:text-slate-300 underline">Reset Storage</button>
            <span class="text-[10px] text-slate-600 font-mono">v1.2.0 PWA</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboardScreen" class="w-full max-w-lg hidden space-y-5">
        
        <!-- Header & Profile Bar -->
        <header class="bg-cardBg border border-slate-700 rounded-xl p-4 flex items-center justify-between shadow-lg">
            <div>
                <h1 class="text-sm font-bold tracking-wide text-slate-100 uppercase">Human OS Dashboard</h1>
                <p id="loggedUserDisplay" class="text-xs text-slate-400">Profile Active</p>
            </div>
            <div class="flex items-center space-x-2">
                <span id="badgeDisplay" class="text-[10px] px-2 py-1 rounded font-bold uppercase transition">Free Tier</span>
                <button type="button" onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg transition">Sign Out</button>
            </div>
        </header>

        <!-- Phase Selector Banner -->
        <div id="phaseContainer" class="bg-cardBg border border-slate-700 rounded-xl p-4 shadow-lg transition-all duration-300">
            <div class="flex justify-between items-center mb-3">
                <h2 id="phaseHeaderTitle" class="text-xs font-semibold uppercase tracking-wider text-accentGold">Phase 1: Reset (30 Days)</h2>
                <span id="tierStatusText" class="text-[11px] font-bold">🟢 Free Tier Active</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectPhase(30)" id="phase30Btn" class="p-2.5 rounded-lg text-center border text-xs font-bold transition">
                    Phase 1<br><span class="text-[10px] font-normal text-slate-400">30 Days (Reset)</span>
                </button>
                <button type="button" onclick="selectPhase(60)" id="phase60Btn" class="relative p-2.5 rounded-lg text-center border text-xs font-bold transition">
                    <span id="lock60" class="absolute top-1 right-1 text-[11px]">🔒</span>
                    Phase 2<br><span class="text-[10px] font-normal text-slate-400">60 Days (Build)</span>
                </button>
                <button type="button" onclick="selectPhase(90)" id="phase90Btn" class="relative p-2.5 rounded-lg text-center border text-xs font-bold transition">
                    <span id="lock90" class="absolute top-1 right-1 text-[11px]">🔒</span>
                    Phase 3<br><span class="text-[10px] font-normal text-slate-400">90 Days (Dominate)</span>
                </button>
            </div>
            <p id="phaseDescription" class="text-xs text-slate-300 mt-3 italic text-center"></p>
        </div>

        <!-- Progress Overview Card -->
        <div class="bg-cardBg border border-slate-700 rounded-xl p-4 shadow-lg text-center">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wide text-slate-300">Daily Execution Score</span>
                <span id="streakCount" class="text
